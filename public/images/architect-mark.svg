<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="The Architect mark">
  <!-- LOCKED ARCHITECT MARK — use this file; do not redraw.
       4 concentric squares, one continuous gradient stroke:
       full Gold #F0C040 at top-left → faded Navy #070D1F at bottom-right.
       Faint gold X centered inside the innermost square only. No center dot. -->
  <defs>
    <linearGradient id="archGoldNavy" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="60" y2="60">
      <stop offset="0" stop-color="#F0C040"/>
      <stop offset=".55" stop-color="#C9A23B"/>
      <stop offset="1" stop-color="#070D1F" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#archGoldNavy)" stroke-width="1.6">
    <rect x="4.8" y="4.8" width="54.4" height="54.4"/>
    <rect x="9.3" y="9.3" width="45.4" height="45.4"/>
    <rect x="13.8" y="13.8" width="36.4" height="36.4"/>
    <rect x="18.3" y="18.3" width="27.4" height="27.4"/>
  </g>
  <g stroke="#C9A23B" stroke-opacity=".5" stroke-width="1" stroke-linecap="round">
    <line x1="23.5" y1="23.5" x2="40.5" y2="40.5"/>
    <line x1="40.5" y1="23.5" x2="23.5" y2="40.5"/>
  </g>
</svg>
